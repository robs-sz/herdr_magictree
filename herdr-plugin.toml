id = "magictree"
name = "Magictree Stacks"
version = "0.1.3"
min_herdr_version = "0.9.0"
description = "Start this worktree's magictree development stack when Herdr creates a worktree"
platforms = ["macos", "linux"]

[[build]]
command = ["bun", "install"]

# Install-time requirement: a non-zero exit here aborts `herdr plugin install`.
# Runs after `bun install` because it imports the plugin's config defaults.
[[build]]
command = ["bun", "run", "src/require-magictree.ts"]

[[events]]
on = "worktree.created"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "worktree.removed"
command = ["bun", "run", "src/hook.ts"]

[[actions]]
id = "up"
title = "Magictree: start this worktree's stack"
contexts = ["workspace"]
command = ["bun", "run", "src/action-up.ts"]

# Stop the stack before deleting the worktree: Herdr removes the checkout with
# `git worktree remove --force`, which fails with "Directory not empty" while
# the stack is still writing into it, and this plugin's gc only hears about a
# removal after that deletion.
[[actions]]
id = "down"
title = "Magictree: stop this worktree's stack"
contexts = ["workspace"]
command = ["bun", "run", "src/action-down.ts"]

[[actions]]
id = "stack"
title = "Magictree: show stack status"
contexts = ["workspace"]
command = ["bun", "run", "src/open-stack-pane.ts"]

[[panes]]
id = "stack"
title = "magictree"
placement = "popup"
width = 110
height = "85%"
command = ["bun", "run", "src/stack-pane.ts"]
