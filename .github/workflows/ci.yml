name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The manifest declares platforms = ["macos", "linux"].
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Runs every [[build]] command from herdr-plugin.toml, the same phase
      # `herdr plugin install` runs, so a build entry pointing at a moved file
      # fails here instead of during someone's install.
      - name: Manifest build phase
        run: bun run scripts/verify-build.ts

      - name: Tests
        run: bun test
